name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as local development: the Command Line Tools, not Xcode.
      - name: Select the Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          swift --version

      - name: Unit tests
        run: scripts/test.sh

      - name: Release build
        run: swift build -c release --product Rambla

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            scripts/hooks/commit-msg /tmp/msg || { echo "::error::$sha is not a Conventional Commit"; exit 1; }
          done
