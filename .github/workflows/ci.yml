name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The Swift used for development (6.3, macOS 26 SDK). The runner's Command Line Tools are newer (Swift 6.4 with
      # the macOS 27 beta SDK, where SwiftUI's @State is a macro whose plugin only ships inside Xcode), so CI builds
      # with Xcode 26's toolchain.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          DEVELOPER_DIR="$XCODE/Contents/Developer" swift --version

      - name: Unit tests
        run: scripts/test.sh

      - name: Release build
        run: swift build -c release --product Rambla

      # Every text the app shows needs its English line in Packaging/en.lproj/Localizable.strings.
      - name: English translation is complete
        run: scripts/check-localization.sh

      # Pull requests are squash-merged with their title as the commit message, and versions are computed
      # from those messages: the title must be a Conventional Commit (individual commits can be anything).
      - name: Pull request title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > /tmp/title
          scripts/hooks/commit-msg /tmp/title || { echo "::error::Usá un título tipo 'fix: …' o 'feat(scope): …' (Conventional Commits)."; exit 1; }
